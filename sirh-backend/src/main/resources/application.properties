# ==========================================
# SECURITY
# ==========================================
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin123}
spring.security.user.roles=${SPRING_SECURITY_USER_ROLES:ADMIN}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

cors.allowed-headers=*


# ==========================================
# LOGGING
# ==========================================
logging.level.com.fric.sirh=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO


# ==========================================
# SPRING DOCS / SWAGGER
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# ==========================================
# DISABLE REDIS COMPLETELY
# ==========================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.data.redis.repositories.enabled=false


# ==========================================
# SESSION
# ==========================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true


# ==========================================
# DEFAULT USERS
# ==========================================
default.admin.email=${DEFAULT_ADMIN_EMAIL:admin@sirh.com}
default.admin.password=${DEFAULT_ADMIN_PASSWORD:admin123}

default.rh.email=${DEFAULT_RH_EMAIL:rh@sirh.com}
default.rh.password=${DEFAULT_RH_PASSWORD:rh123456}


# ==========================================
# FILE STORAGE CONFIGURATION
# ==========================================
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true


# ==========================================
# STATIC RESOURCES
# ==========================================
spring.web.resources.static-locations=classpath:/static/,file:${file.upload-dir}/
spring.web.resources.add-mappings=true


# ==========================================
# CONGÉS ANNUELS CONFIGURABLES
# ==========================================
conge.base-jours=24


# ==========================================
# OCR CONFIGURATION
# ==========================================
ocr.space.api.key=${OCR_SPACE_API_KEY:helloworld}

ocr.space.enabled=${OCR_ENABLED:true}

ocr.space.timeout=60


# ==========================================
# TESSERACT
# ==========================================
ocr.tesseract.enabled=false

tesseract.data.path=${user.home}/.tesseract_data


# ==========================================
# PDF / OCR
# ==========================================
pdf.render.dpi=300
pdf.render.dpi.ocr=300


# ==========================================
# PAYSLIP PROCESSING CONFIGURATION
# ==========================================
payslip.max-pages=20

payslip.async.pool.size=5
payslip.async.queue.capacity=100


# ==========================================
# THREAD POOL CONFIGURATION
# ==========================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=payslip-worker-


# ==========================================
# CACHE CONFIGURATION
# ==========================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60m


# ==========================================
# PERFORMANCE CONFIGURATION
# ==========================================
spring.mvc.async.request-timeout=600000