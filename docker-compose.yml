services:

  # ==========================================
  # MONGODB
  # ==========================================
  mongodb:
    image: mongo:8
    container_name: sirh-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: sirh_db

    ports:
      - "27018:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - sirh-network


  # ==========================================
  # BACKEND SPRING BOOT
  # ==========================================
  backend:
    build:
      context: ./sirh-backend
      dockerfile: Dockerfile

    container_name: sirh-backend
    restart: unless-stopped

    environment:
      # MongoDB Docker en local
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://mongodb:27017/sirh_db}

      # Email
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-604800000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

      # Fichiers
      FILE_UPLOAD_DIR: ${FILE_UPLOAD_DIR:-/app/uploads}

      # OCR
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-helloworld}
      OCR_ENABLED: ${OCR_ENABLED:-true}

      # Port Spring Boot
      PORT: ${PORT:-10000}

    volumes:
      - sirh_uploads:/app/uploads

    depends_on:
      mongodb:
        condition: service_healthy

    ports:
      - "8080:10000"

    networks:
      - sirh-network


  # ==========================================
  # FRONTEND ANGULAR + NGINX
  # ==========================================
  frontend:
    build:
      context: ./sirh-frontend
      dockerfile: Dockerfile

    container_name: sirh-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "4200:80"

    networks:
      - sirh-network


# ==========================================
# VOLUMES
# ==========================================
volumes:
  mongodb_data:
    name: sirh-mongodb-data

  sirh_uploads:
    name: sirh-uploads


# ==========================================
# NETWORK
# ==========================================
networks:
  sirh-network:
    name: sirh-network
    driver: bridge